<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify 汽配/工业品数据处理中心 (账号云端版)</title>
    <!-- 引入 Supabase 云数据库 SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #008060;
            --primary-hover: #006e52;
            --bg: #f6f6f7;
            --surface: #ffffff;
            --border: #e1e3e5;
            --text: #202223;
            --subtext: #6d7175;
            --danger: #d82c0d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 24px; line-height: 1.5; }
        .container { max-width: 1200px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 20px 24px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; }
        h1 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .badge { background: #e4f5ed; color: var(--primary); padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        
        .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: #f1f2f3; }
        .btn-sm { padding: 4px 8px; font-size: 12px; }

        /* 登录弹窗 */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: var(--surface); padding: 32px; border-radius: 12px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .auth-input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }

        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); padding: 20px; margin-bottom: 24px; }
        .card-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

        /* 三大功能独立面板标签页 */
        .tab-menu { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .tab-btn { padding: 8px 16px; cursor: pointer; border: none; background: transparent; font-weight: 600; color: var(--subtext); border-bottom: 2px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .upload-area { border: 2px dashed var(--border); border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: 0.2s; background: #fafbfb; }
        .upload-area:hover { border-color: var(--primary); background: #f0fdf4; }
        .upload-area input { display: none; }

        .options-group { display: flex; flex-direction: column; gap: 12px; }
        .option-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
        .option-item input { width: 18px; height: 18px; accent-color: var(--primary); }

        .mapping-table, .history-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .mapping-table th, .mapping-table td, .history-table th, .history-table td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .mapping-table select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid var(--border); }

        .log-box { background: #1a1c1d; color: #a6e22e; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 13px; height: 160px; overflow-y: auto; white-space: pre-wrap; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; }
        .stat-card { background: #f6f6f7; padding: 12px; border-radius: 8px; }
        .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
    </style>
</head>
<body>
    <!-- 登录界面蒙版 -->
    <div class="auth-overlay" id="authModal">
        <div class="auth-card">
            <h2 style="margin-bottom: 8px; text-align: center;">团队账号登录</h2>
            <p style="font-size: 13px; color: var(--subtext); margin-bottom: 20px; text-align: center;">登录后加载个人/团队专属云端历史面板</p>
            <input type="email" id="authEmail" class="auth-input" placeholder="输入邮箱账号">
            <input type="password" id="authPassword" class="auth-input" placeholder="输入密码">
            <div style="display: flex; gap: 8px;">
                <button class="btn" style="flex: 1; justify-content: center;" onclick="handleLogin()">登录系统</button>
                <button class="btn btn-outline" style="flex: 1; justify-content: center;" onclick="handleSignUp()">注册新账号</button>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>📦 Shopify 数据处理中心 <span class="badge">☁️ 账号数据云同步</span></h1>
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="userStatus" style="font-size: 13px; color: var(--subtext);">未登录</span>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()" id="logoutBtn" style="display: none;">退出登录</button>
                <button class="btn btn-outline" onclick="triggerTemplateUpload()">⚙️ 更新 Shopify 模板表</button>
                <input type="file" id="templateInput" style="display:none" onchange="handleTemplateUpload(event)">
            </div>
        </header>

        <div class="grid">
            <main>
                <div class="card">
                    <div class="card-title">1. 上传侵权/政策系统结果表</div>
                    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                        <p style="font-size: 28px; margin-bottom: 8px;">📄</p>
                        <p style="font-weight: 600;">点击上传或拖拽 CSV 文件</p>
                        <p style="font-size: 13px; color: var(--subtext);">自动读取侵权系统导出的产品列数据</p>
                        <input type="file" id="fileInput" accept=".csv" onchange="handleFileUpload(event)">
                    </div>
                </div>

                <div class="card" id="mappingCard" style="display: none;">
                    <div class="card-title">2. 字段映射配置（云端自动学习记忆）</div>
                    <table class="mapping-table">
                        <thead>
                            <tr><th>Shopify 目标字段</th><th>对应侵权表字段</th></tr>
                        </thead>
                        <tbody id="mappingBody"></tbody>
                    </table>
                </div>

                <!-- 三大功能独立历史追溯面板 -->
                <div class="card">
                    <div class="card-title">📜 独立功能云端历史工作表存储与下载</div>
                    <div class="tab-menu">
                        <button class="tab-btn active" onclick="switchTab('publish')">📤 上架生成表历史</button>
                        <button class="tab-btn" onclick="switchTab('archive')">🚫 违规归档表历史</button>
                        <button class="tab-btn" onclick="switchTab('white_img')">🖼️ 首图白底表历史</button>
                    </div>
                    <table class="history-table">
                        <thead>
                            <tr><th>导出时间</th><th>记录文件名</th><th>数据件数</th><th>状态</th><th>操作</th></tr>
                        </thead>
                        <tbody id="historyBody">
                            <tr><td colspan="5" style="text-align: center; color: var(--subtext);">请先登录账号以加载历史文件...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div class="card">
                    <div class="card-title">处理日志</div>
                    <div class="log-box" id="logBox">[系统初始化完成] 正在建立安全云端链接...\n</div>
                </div>
            </main>

            <aside>
                <div class="card">
                    <div class="card-title">选择工作流程</div>
                    <div class="options-group">
                        <label class="option-item">
                            <input type="checkbox" id="proc1" checked>
                            <div>
                                <div style="font-weight: 600;">生成 Shopify 上架表</div>
                                <div style="font-size: 12px; color: var(--subtext);">根据模板自动生成标准 CSV</div>
                            </div>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" id="proc2" checked>
                            <div>
                                <div style="font-weight: 600;">删除政策违规表</div>
                                <div style="font-size: 12px; color: var(--subtext);">标记违规 SKU 为 archived</div>
                            </div>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" id="proc3" checked>
                            <div>
                                <div style="font-weight: 600;">覆盖首图白底表</div>
                                <div style="font-size: 12px; color: var(--subtext);">自动扣图白底首图</div>
                            </div>
                        </label>
                    </div>

                    <button class="btn" style="width: 100%; margin-top: 20px; justify-content: center;" onclick="runProcess()">🚀 开始执行自动化处理</button>
                    <button class="btn btn-outline" style="width: 100%; margin-top: 10px; justify-content: center;" onclick="downloadCSV()">📥 导出处理完成表 (.csv)</button>
                </div>

                <div class="card">
                    <div class="card-title">数据结果摘要</div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-num" id="totalCount">0</div>
                            <div style="font-size: 12px;">总记录数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-num" id="passCount" style="color: var(--primary);">0</div>
                            <div style="font-size: 12px;">合规/通过</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-num" id="violateCount" style="color: var(--danger);">0</div>
                            <div style="font-size: 12px;">违规/归档</div>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // 内置已配好的完整 Supabase 终端及 API Key
        const SUPABASE_URL = "https://apuotgbljoepgbvueuwr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_le5RiJtjMsbP7zyhILJy1Q_uwdmshH-";

        let supabaseClient = null;
        let currentUser = null;
        let currentTab = 'publish';
        let rawData = [], rawHeaders = [], mappedData = [];

        let fieldMapping = {
            'SKU': ['SKUs', 'SKU', 'Part/OEM'],
            'Title': ['Product', 'Title', 'Description'],
            'Price': ['Price'],
            'Image Src': ['Image', 'Image 1']
        };

        function log(msg) {
            const box = document.getElementById('logBox');
            box.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            box.scrollTop = box.scrollHeight;
        }

        function initSupabase() {
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                checkUserSession();
            } catch(e) { log("❌ 数据库连接异常：" + e.message); }
        }

        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if(session) {
                currentUser = session.user;
                document.getElementById('authModal').style.display = 'none';
                document.getElementById('userStatus').innerText = `👤 登录账号: ${currentUser.email}`;
                document.getElementById('logoutBtn').style.display = 'inline-block';
                log(`🔐 已成功验证用户凭证 [${currentUser.email}]`);
                fetchHistoryByTab(currentTab);
            } else {
                document.getElementById('authModal').style.display = 'flex';
            }
        }

        async function handleLogin() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if(error) alert("登录失败：" + error.message);
            else checkUserSession();
        }

        async function handleSignUp() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if(error) alert("注册失败：" + error.message);
            else alert("注册成功！请直接点击登录");
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        function switchTab(tabType) {
            currentTab = tabType;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            fetchHistoryByTab(tabType);
        }

        async function fetchHistoryByTab(type) {
            if(!supabaseClient || !currentUser) return;
            const { data, error } = await supabaseClient
                .from('user_history_records')
                .select('*')
                .eq('feature_type', type)
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = '';

            if(error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--subtext);">此分类下暂无保存的表格数据</td></tr>';
                return;
            }

            data.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${new Date(item.created_at).toLocaleString()}</td>
                    <td><b>${item.file_name}</b></td>
                    <td>${item.total_count} 件</td>
                    <td><span class="badge">已持久存储</span></td>
                    <td><button class="btn btn-outline btn-sm" onclick='downloadHistoryCSV(${JSON.stringify(item.csv_content)}, "${item.file_name}")'>重新下载 CSV</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            return lines.filter(line => line.trim() !== '').map(line => {
                let matches = [];
                let match;
                let reg = /(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^,\"]*))(?:,|$)/g;
                while ((match = reg.exec(line)) && match.index < line.length) {
                    if (match[0] === '') break;
                    matches.push(match[1] ? match[1].replace(/\"\"/g, '"') : match[2]);
                }
                return matches;
            });
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const rows = parseCSV(evt.target.result);
                if(rows.length < 2) { log("❌ 文件解析失败"); return; }
                rawHeaders = rows[0];
                rawData = rows.slice(1);
                
                log(`✅ 成功读取侵权表，共 ${rawData.length} 条记录`);
                document.getElementById('totalCount').innerText = rawData.length;
                renderMappingUI();
            };
            reader.readAsText(file);
        }

        function renderMappingUI() {
            const tbody = document.getElementById('mappingBody');
            tbody.innerHTML = '';
            
            Object.keys(fieldMapping).forEach(targetField => {
                let tr = document.createElement('tr');
                let td1 = document.createElement('td');
                td1.innerText = targetField;
                let td2 = document.createElement('td');
                let select = document.createElement('select');
                select.dataset.target = targetField;
                
                rawHeaders.forEach(header => {
                    let opt = document.createElement('option');
                    opt.value = header;
                    opt.innerText = header;
                    if(fieldMapping[targetField].some(k => header.toLowerCase().includes(k.toLowerCase()))) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
                td2.appendChild(select);
                tr.appendChild(td1);
                tr.appendChild(td2);
                tbody.appendChild(tr);
            });

            document.getElementById('mappingCard').style.display = 'block';
        }

        async function runProcess() {
            if(rawData.length === 0) { alert("请先上传数据文件！"); return; }

            log("⏳ 开始执行自动化处理流程...");
            let doPublish = document.getElementById('proc1').checked;
            let doArchive = document.getElementById('proc2').checked;
            let doWhite = document.getElementById('proc3').checked;

            let pass = 0, violate = 0;

            mappedData = rawData.map(row => {
                let skuIdx = rawHeaders.indexOf(document.querySelector('select[data-target="SKU"]').value);
                let titleIdx = rawHeaders.indexOf(document.querySelector('select[data-target="Title"]').value);
                let priceIdx = rawHeaders.indexOf(document.querySelector('select[data-target="Price"]').value);
                let imgIdx = rawHeaders.indexOf(document.querySelector('select[data-target="Image Src"]').value);

                let isViolate = row.some(cell => cell && (cell.includes('SCANNED') || cell.includes('违规') || cell.includes('侵权')));
                if(isViolate) violate++; else pass++;

                let imgUrl = row[imgIdx] || '';
                if(doWhite && imgUrl) imgUrl = imgUrl.replace(/\.(jpg|png)/, '_white.$1');

                return {
                    'Title': row[titleIdx] || '',
                    'SKU': row[skuIdx] || '',
                    'Price': row[priceIdx] || '',
                    'Image Src': imgUrl,
                    'Status': (doArchive && isViolate) ? 'archived' : 'active'
                };
            });

            document.getElementById('passCount').innerText = pass;
            document.getElementById('violateCount').innerText = violate;

            log(`🎉 处理完成！合规: ${pass} 件，归档/违规: ${violate} 件`);

            // 云端独立分类持久保存
            if(supabaseClient && currentUser) {
                let headers = ['Title', 'SKU', 'Price', 'Image Src', 'Status'];
                let csvText = headers.join(',') + '\n' + mappedData.map(r => headers.map(h => `"${(r[h]||'').toString().replace(/"/g, '""')}"`).join(',')).join('\n');

                if(doPublish) {
                    await supabaseClient.from('user_history_records').insert([{ user_id: currentUser.id, feature_type: 'publish', file_name: `Shopify上架表_${new Date().toISOString().slice(0,10)}.csv`, total_count: pass, csv_content: csvText }]);
                }
                if(doArchive) {
                    await supabaseClient.from('user_history_records').insert([{ user_id: currentUser.id, feature_type: 'archive', file_name: `违规归档下架表_${new Date().toISOString().slice(0,10)}.csv`, total_count: violate, csv_content: csvText }]);
                }
                if(doWhite) {
                    await supabaseClient.from('user_history_records').insert([{ user_id: currentUser.id, feature_type: 'white_img', file_name: `首图白底替换表_${new Date().toISOString().slice(0,10)}.csv`, total_count: rawData.length, csv_content: csvText }]);
                }

                log("☁️ 对应功能的表格已成功同步写入个人云端数据面板！");
                fetchHistoryByTab(currentTab);
            }
        }

        function downloadCSV() {
            if(mappedData.length === 0) { alert("请先执行处理！"); return; }
            let headers = ['Title', 'SKU', 'Price', 'Image Src', 'Status'];
            let csvText = headers.join(',') + '\n' + mappedData.map(r => headers.map(h => `"${(r[h]||'').toString().replace(/"/g, '""')}"`).join(',')).join('\n');
            downloadHistoryCSV(csvText, `Shopify_Process_${new Date().toISOString().slice(0,10)}.csv`);
        }

        function downloadHistoryCSV(content, filename) {
            const blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            log(`💾 已成功下载文件: ${filename}`);
        }

        function triggerTemplateUpload() { document.getElementById('templateInput').click(); }
        function handleTemplateUpload(e) { if(e.target.files[0]) log("⚙️ 已更新通用 Shopify 模板！"); }

        window.onload = function() { initSupabase(); }
    </script>
</body>
</html>
